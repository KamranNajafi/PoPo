name: Release

# Releases are cut by bumping VERSION, not by pushing a tag: the tag is an
# output of the release rather than its trigger, so the version that was built
# and the version that was tagged cannot disagree. The workflow creates the tag
# itself when it publishes.
on:
  push:
    # The workflow itself is a trigger too: a release that failed on a pipeline
    # bug should re-attempt when the bug is fixed, without needing a version
    # number the release never actually reached.
    paths:
      - 'VERSION'
      - '.github/workflows/release.yml'
      - 'tool/build_core_android.sh'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override the version tag, e.g. v0.1.0 (default: read VERSION)'
        required: false
      prerelease:
        description: 'Mark as a prerelease'
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26'

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      stamp: ${{ steps.pick.outputs.stamp }}
      already_released: ${{ steps.existing.outputs.found }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        # Resolved once here so no later job has to repeat the guess.
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          # One timestamp for the whole run, so every artifact from one build
          # carries the same one. Computing it per job would let two files from
          # the same release disagree about when they were built.
          stamp="$(date -u +%Y%m%d-%H%M)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "building $tag at $stamp"

      - id: existing
        # Touching VERSION for an unrelated reason should not republish, and
        # re-running should be harmless — but a release whose assets do not
        # match the current naming is not really "already released", it is a
        # release that needs its files rebuilt. Checking the names rather than
        # just the tag makes the pipeline able to repair its own output.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The arm64 build is the one every release must carry; its name is the
          # canary for whether the whole set is current.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' \
             | grep -q "^PoPo-v${VERSION}-android-arm64-"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released with current asset names; skipping"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG exists but its assets are stale; rebuilding them"
          fi

  reconcile:
    name: Reconcile an existing release
    needs: version
    if: needs.version.outputs.already_released == 'true'
    runs-on: ubuntu-latest
    steps:
      # Publishing is skipped once a version exists, so a wrong flag on an
      # already-published release would otherwise be unfixable through the
      # pipeline. Overstating readiness is exactly the kind of wrong flag worth
      # being able to correct.
      - name: Ensure the prerelease flag matches intent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          WANT_PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
        run: |
          current="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                       --json isPrerelease --jq '.isPrerelease')"
          echo "$TAG is prerelease=$current, want $WANT_PRERELEASE"
          if [ "$current" != "$WANT_PRERELEASE" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease="$WANT_PRERELEASE"
            echo "::notice::corrected $TAG to prerelease=$WANT_PRERELEASE"
          fi

  core-android:
    name: Core (Android .aar)
    needs: version
    if: needs.version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Build the core
        env:
          # gomobile needs the NDK explicitly; ANDROID_NDK_LATEST_HOME on the
          # runner moves between images, so the version is pinned above.
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          echo "using NDK at $ANDROID_NDK_HOME"
          tool/build_core_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: popocore-aar
          path: android/app/libs/popocore.aar
          if-no-files-found: error

  android:
    name: Android APK
    needs: [version, core-android]
    if: needs.version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: popocore-aar
          path: android/app/libs/

      - run: flutter pub get

      - name: Build
        # Split per ABI: one universal APK carrying three copies of a 30MB core
        # is a needlessly large download on a connection the user is trying to
        # get working in the first place.
        run: flutter build apk --release --split-per-abi

      - name: Name the outputs after the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          mkdir -p dist
          # The ABI alone tells a non-technical user nothing, so the audience is
          # part of the name. The identifying half comes first, because a phone
          # truncates the middle of a long filename.
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            case "$(basename "$apk")" in
              *arm64-v8a*)   name="android-arm64-most-phones" ;;
              *armeabi-v7a*) name="android-arm32-older-phones" ;;
              *x86_64*)      name="android-x86_64-emulator" ;;
              *)             name="android-$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')" ;;
            esac
            cp "$apk" "dist/PoPo-v${VERSION}-${name}-${STAMP}.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error

  desktop-linux:
    name: Desktop core (Linux)
    needs: version
    if: needs.version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Build the shared library
        run: tool/build_core_desktop.sh

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          mkdir -p dist
          tar -czf "dist/PoPo-v${VERSION}-linux-x64-core-library-${STAMP}.tar.gz" \
            -C linux/lib libpopocore.so
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  web:
    name: Web preview bundle
    needs: version
    if: needs.version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        # The design canvas, for reviewing the UI without a device. It cannot
        # tunnel — web has no raw sockets — and the app says so.
        run: flutter build web --release

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          mkdir -p dist
          tar -czf "dist/PoPo-v${VERSION}-web-design-canvas-${STAMP}.tar.gz" -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, android, desktop-linux, web]
    if: needs.version.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Remove assets this build did not produce
        # Uploading alone would leave the previous naming sitting next to the new
        # one, which is worse than either — the reader now has two sets and no
        # way to tell which is current.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null > existing.txt || true

          while read -r asset; do
            [ -z "$asset" ] && continue
            if [ ! -f "dist/$asset" ]; then
              echo "removing stale asset: $asset"
              gh release delete-asset "$TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            fi
          done < existing.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # Creates the tag at this commit when it does not already exist, which
          # is what a manual dispatch needs.
          target_commitish: ${{ github.sha }}
          name: PoPo ${{ needs.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          # On a push there is no input, and an absent input compares equal to
          # false — which published v0.1.0 as a full release when it should have
          # been a preview. Default to prerelease unless a dispatch says
          # otherwise.
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          fail_on_unmatched_files: true
