name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.24'

jobs:
  core-android:
    name: Core (Android .aar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Build the core
        env:
          # gomobile needs the NDK explicitly; ANDROID_NDK_LATEST_HOME on the
          # runner moves between images, so the version is pinned above.
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          echo "using NDK at $ANDROID_NDK_HOME"
          tool/build_core_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: popocore-aar
          path: android/app/libs/popocore.aar
          if-no-files-found: error

  android:
    name: Android APK
    needs: core-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: popocore-aar
          path: android/app/libs/

      - run: flutter pub get

      - name: Build
        # Split per ABI: one universal APK carrying three copies of a 30MB core
        # is a needlessly large download on a connection the user is trying to
        # get working in the first place.
        run: flutter build apk --release --split-per-abi

      - name: Name the outputs after the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')"
            cp "$apk" "dist/popo-${version}-${abi}.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error

  desktop-linux:
    name: Desktop core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Build the shared library
        run: tool/build_core_desktop.sh

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/popocore-${version}-linux-x64.tar.gz" -C linux/lib libpopocore.so
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  web:
    name: Web preview bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        # The design canvas, for reviewing the UI without a device. It cannot
        # tunnel — web has no raw sockets — and the app says so.
        run: flutter build web --release

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/popo-${version}-web-canvas.tar.gz" -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [android, desktop-linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PoPo ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          # First release of an app whose tunnel has never run on real hardware.
          prerelease: true
          fail_on_unmatched_files: true
